<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Menu – L’aventure pirate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="menuScene">

  <!-- FOND -->
  <img src="images/Fondmenu.PNG" class="menu-bg" alt="fond pirate">

  <!-- CINÉMATIQUE -->
  <div id="cinematic">
    <div class="cinematic-text">Nouveau pirate débloqué…</div>
  </div>

  <!-- NOTIFICATION -->
  <div id="notification">
    🎉 Nouveau pirate débloqué !
  </div>

  <!-- BULLE D'INFO -->
  <div id="bubble">
    Bravo Moussaillon 🏴‍☠️<br><br>
    Clique sur chaque pirate pour débloquer le suivant.<br>
    Bon courage 💎
    <br><br>
    <button id="closeBubble">OK</button>
  </div>

  <!-- PIRATES -->
  <div class="pirates-container">

    <div class="pirate unlocked" id="pirate1" data-id="1" data-page="mission1.html">
      <img src="images/pirate1.png">
    </div>

    <div class="pirate locked" id="pirate2" data-id="2">
      <img src="images/pirate2.png">
    </div>

    <div class="pirate locked" id="pirate3" data-id="3" data-page="mission3.html">
      <img src="images/pirate3.png">
    </div>

    <div class="pirate locked" id="pirate4" data-id="4" data-page="mission4.html">
      <img src="images/pirate4.png">
    </div>

    <div class="pirate locked" id="pirate5" data-id="5" data-page="mission5.html">
      <img src="images/pirate5.png">
    </div>

  </div>

  <!-- RESET -->
  <button id="resetAdventure">
    🔄 Recommencer l’aventure
  </button>

</div>

<script src="menu.js"></script>
</body>
</html>
