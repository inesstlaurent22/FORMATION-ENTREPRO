<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIT IN - Menu Pirates</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔔 NOTIFICATION -->
<div id="notification">🏴‍☠️ Nouveau pirate débloqué !</div>

<!-- 🔄 RESET -->
<button id="resetAdventure">🔄 Reset aventure</button>

<!-- 🔊 AUDIO -->
<audio id="unlockSound" src="audio/unlock.mp3" preload="auto"></audio>

<div class="scene">

  <img src="images/fondindex.PNG" class="background" alt="Fond">

  <div class="pirates-container">

    <!-- PIRATE 1 -->
    <div class="pirate pirate1 locked" id="pirate1">
      <img src="images/Pirate1.png" alt="Pirate 1">
    </div>

    <!-- PIRATE 2 (UNLOCK AU DÉPART) -->
    <div class="pirate pirate2 unlocked" id="pirate2">
      <img src="images/Pirate2.png" alt="Pirate 2">
    </div>

  </div>

  <!-- BULLE -->
  <div id="infoBubble">
    <p>
      🏴‍☠️ Bravo moussaillon !<br><br>
      Une nouvelle quête est disponible.
      Clique sur le pirate libéré pour commencer.
    </p>
  </div>

</div>

<script src="menu.js"></script>
</body>
</html>
