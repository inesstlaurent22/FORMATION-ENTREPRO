<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Menu – L’aventure pirate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="scene">

  <!-- FOND -->
  <img src="images/Fondmenu.PNG" class="menu-bg" alt="">

  <!-- CINÉMATIQUE -->
  <div id="cinematic">
    <div class="cinematic-text">Nouveau pirate débloqué…</div>
  </div>

  <!-- NOTIFICATION -->
  <div id="notification">
    Vous avez débloqué un nouveau pirate
  </div>

  <!-- BULLE DE TEXTE -->
  <div id="bubble">
    Bravo Moussaillon 🏴‍☠️<br><br>
    L’aventure commence, clique sur chaque pirate pour débloquer le suivant.<br>
    Bon courage 💎
  </div>

  <!-- PIRATES -->
  <div class="pirates-container">
    <div class="pirate" data-id="1">
      <img src="images/pirate1.png" alt="">
    </div>

    <div class="pirate" data-id="2">
      <img src="images/pirate2.png" alt="">
    </div>

    <div class="pirate" data-id="3">
      <img src="images/pirate3.png" alt="">
    </div>

    <div class="pirate" data-id="4">
      <img src="images/pirate4.png" alt="">
    </div>

    <div class="pirate" data-id="5">
      <img src="images/pirate5.png" alt="">
    </div>
  </div>

  <!-- RESET -->
  <button id="resetAdventure">
    🔄 Recommencer l’aventure
  </button>

</div>

<script src="menu.js"></script>
</body>
</html>
