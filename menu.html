<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIT IN - Menu Pirates</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔔 NOTIFICATION -->
<div id="notification">🏴‍☠️ Nouveau pirate débloqué !</div>

<!-- 🔄 RESET AVENTURE -->
<button id="resetAdventure">🔄 Réinitialiser l’aventure</button>

<!-- 🔊 AUDIO FEEDBACK -->
<audio id="unlockSound" preload="auto">
  <source src="audio/unlock.mp3" type="audio/mpeg">
</audio>

<div class="scene">

  <img src="images/fondindex.PNG" class="background" alt="Fond">

  <div class="pirates-container">

    <div class="pirate pirate1 locked" id="pirate1" data-page="commerce.html">
      <img src="images/Pirate1.png" alt="Pirate 1">
    </div>

    <div class="pirate pirate2 unlocked" id="pirate2">
      <img src="images/Pirate2.png" alt="Pirate 2">
    </div>

    <div class="pirate pirate3 locked" id="pirate3" data-page="marketing.html">
      <img src="images/Pirate3.png" alt="Pirate 3">
    </div>

    <div class="pirate pirate4 locked" id="pirate4" data-page="finance.html">
      <img src="images/Pirate4.png" alt="Pirate 4">
    </div>

    <div class="pirate pirate5 locked" id="pirate5" data-page="legal.html">
      <img src="images/Pirate5.png" alt="Pirate 5">
    </div>

  </div>

  <!-- 💬 BULLE -->
  <div id="infoBubble">
    <p>
     🏴‍☠️ Bravo moussaillon !<br><br>
      Termine chaque mission pour débloquer
      le pirate suivant.<br>
      L’aventure commence maintenant !
    </p>
    <button id="closeBubble">Compris !</button>
  </div>

</div>

<script src="menu.js"></script>
</body>
</html>
