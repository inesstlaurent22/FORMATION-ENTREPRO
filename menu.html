<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIT IN - Menu Pirates</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔔 NOTIFICATION -->
<div id="notification">🏴‍☠️ Nouveau pirate débloqué !</div>

<div class="scene">

  <img src="images/fondindex.PNG" class="background" alt="Fond">

  <div class="pirates-container">

    <!-- Pirate 1 (LOCK AU DÉPART) -->
    <div class="pirate pirate1 locked" id="pirate1">
      <img src="images/Pirate1.png" alt="Pirate 1">
    </div>

    <!-- Pirate 2 (TOUJOURS UNLOCK) -->
    <div class="pirate pirate2 unlocked" id="pirate2">
      <img src="images/Pirate2.png" alt="Pirate 2">
    </div>

  </div>

  <!-- BULLE -->
  <div id="infoBubble">
    <p>
      🏴‍☠️ Bravo moussaillon !<br><br>
      Tu viens de débloquer un nouveau pirate.
    </p>
    <button id="closeBubble">Compris !</button>
  </div>

</div>

<script src="menu.js"></script>
</body>
</html>
