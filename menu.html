<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Menu – L’aventure pirate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="scene">

  <!-- FOND -->
  <img src="images/Fondmenu.PNG" class="menu-bg" alt="fond pirate">

  <!-- NOTIFICATION -->
  <div id="notification">Un nouveau pirate est débloqué 💎</div>

  <!-- BULLE AU DESSUS DU PIRATE 2 -->
  <div id="bubble">
    Bravo Moussaillon 🏴‍☠️<br><br>
    L’aventure commence…<br>
    Un nouveau pirate est débloqué !
  </div>

  <!-- PIRATES -->
  <div class="pirates-container">

    <div class="pirate locked" id="pirate1" data-id="1">
      <img src="images/Pirate1.png">
    </div>

    <div class="pirate unlocked" id="pirate2" data-id="2">
      <img src="images/Pirate2.png">
    </div>

    <div class="pirate locked" id="pirate3" data-id="3">
      <img src="images/Pirate3.png">
    </div>

    <div class="pirate locked" id="pirate4" data-id="4">
      <img src="images/Pirate4.png">
    </div>

    <div class="pirate locked" id="pirate5" data-id="5">
      <img src="images/Pirate5.png">
    </div>

  </div>

</div>

<script src="menu.js"></script>
</body>
</html>
