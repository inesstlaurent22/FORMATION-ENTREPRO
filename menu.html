<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Menu Pirates</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Notification -->
  <div id="notification">🎉 Bravo, tu as débloqué un nouveau pirate !</div>

  <!-- Bulle -->
  <div id="bubble">
    Bravo Moussaillon, tu as débloqué ton premier pirate.<br>
    Clique dessus, effectue l’ensemble de la quête et tu pourras débloquer les suivants.<br>
    Bonne aventure ! 🏴‍☠️
  </div>

  <!-- Fond -->
  <div id="background"></div>

  <!-- Pirates -->
  <img id="pirate1" class="pirate locked" src="images/Pirate1.png" alt="Pirate 1">
  <img id="pirate2" class="pirate unlocked" src="images/Pirate2.png" alt="Pirate 2">
  <img id="pirate3" class="pirate locked" src="images/Pirate3.png" alt="Pirate 3">
  <img id="pirate4" class="pirate locked" src="images/Pirate4.png" alt="Pirate 4">
  <img id="pirate5" class="pirate locked" src="images/Pirate5.png" alt="Pirate 5">

  <script src="menu.js"></script>
</body>
</html>
