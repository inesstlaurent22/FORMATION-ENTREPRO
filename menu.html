<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Menu Pirates</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="menu.css">
</head>

<body>

  <!-- 🌤 Sélecteur jour / nuit -->
  <div id="timeSelector">
    <button id="timeToggle">⛅️</button>
    <div id="timeDropdown">
      <button data-mode="day">🌅</button>
      <button data-mode="night">🌃</button>
    </div>
  </div>

  <!-- 🔔 Notification -->
  <div id="notification"></div>

  <!-- 💬 Bulle d’information -->
  <div id="bubble">
    <span id="bubbleText">
      ☠ ☠ ☠<br>
      Bravo Moussaillon, tu as débloqué ton premier pirate 🏴‍☠️<br>
      Clique dessus, effectue l’ensemble de la quête et tu pourras débloquer les suivants.<br>
      Bonne aventure ! ☠
    </span>
    <button id="bubbleButton">Ok, j’ai compris</button>
  </div>

  <!-- 🌌 Fond décoratif -->
  <div id="background"></div>

  <!-- 🏴‍☠️ Pirates -->
  <img id="pirate1" class="pirate locked" src="images/Pirate1.png" alt="Pirate 1 – Commerce">
  <img id="pirate2" class="pirate unlocked" src="images/Pirate2.png" alt="Pirate 2 – Introduction">
  <img id="pirate3" class="pirate locked" src="images/Pirate3.png" alt="Pirate 3 – Communication">
  <img id="pirate4" class="pirate locked" src="images/Pirate4.png" alt="Pirate 4 – Légal">
  <img id="pirate5" class="pirate locked" src="images/Pirate5.png" alt="Pirate 5 – Finance">

  <!-- 🔄 Bouton reset -->
  <button id="resetButton">Réinitialiser la progression</button>

  <!-- 🎬 COFFRE CINÉMATIQUE -->
  <div id="cinematicChest" class="hidden">
    <div class="chest-container" id="chestContainer">
      <img src="images/Tresorfermer.png" id="chestBase" alt="Coffre fermé">
      <img src="images/Tresorcouvercle.png" id="chestLid" alt="Couvercle">
    </div>
  </div>

  <!-- 🎁 Bouton trésor final -->
  <button id="treasureBtn" class="hidden">🎁</button>

  <!-- 📜 Script -->
  <script src="menu.js"></script>

</body>
</html>
