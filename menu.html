<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Menu – L’aventure pirate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="scene">

  <img src="images/Fondmenu.PNG" class="menu-bg">

  <!-- CINEMATIQUE -->
  <div id="cinematic">
    <div class="cinematic-text">Nouveau pirate débloqué…</div>
  </div>

  <!-- Notification -->
  <div id="notification">Vous avez débloqué un nouveau pirate</div>

  <!-- Bulle -->
  <div id="bubble">
    Bravo Moussaillon 🏴‍☠️<br>
    L’aventure commence, clique sur chaque pirate pour débloquer le suivant.<br>
    Bon courage 💎
  </div>

  <!-- Pirates -->
  <div class="pirates-container">
    <div class="pirate" data-id="1"><img src="images/pirate1.png"></div>
    <div class="pirate" data-id="2"><img src="images/pirate2.png"></div>
    <div class="pirate" data-id="3"><img src="images/pirate3.png"></div>
    <div class="pirate" data-id="4"><img src="images/pirate4.png"></div>
    <div class="pirate" data-id="5"><img src="images/pirate5.png"></div>
  </div>

  <!-- Reset -->
  <button id="resetAdventure">🔄 Recommencer l’aventure</button>

</div>

<script src="menu.js"></script>
</body>
</html>
