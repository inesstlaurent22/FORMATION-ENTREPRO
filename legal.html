<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Le bureau du shérif 🚨</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="images/Favicons1.png">
<link rel="apple-touch-icon" href="images/Favicons1.png">
  <link rel="stylesheet" href="legal.css">
</head>
<body>

<!-- =====================================================
     🎬 VIDÉO INTRO
===================================================== -->
<div id="videoContainer">

  <video
    id="questVideo"
    preload="auto"
    autoplay
    muted
    playsinline
  >
    <source src="videos/Legalvideo.mov" type="video/mp4">
    Votre navigateur ne supporte pas la vidéo.
  </video>

  <!-- 🔘 Contrôles vidéo -->
  <div class="videoBtns">
    <button id="soundBtn">🔊</button>
    <button id="skipVideo">Passer la vidéo</button>
  </div>

</div>

<!-- =====================================================
     🌊 SCÈNE PRINCIPALE (BACKGROUND TOUJOURS VISIBLE)
===================================================== -->
<div id="scene" style="display:none;">

  <!-- 🏴‍☠️ Pirate Légal -->
  <div id="pirateLegal" class="pirate">
    <img src="images/Piratelegal.png" alt="Pirate légal">
  </div>

  <!-- 🏴‍☠️ Pirate 1 -->
  <div id="pirate1" class="pirate">
    <img src="images/Pirate2.png" alt="Pirate">
  </div>

  <!-- 💬 Dialogues -->
  <div id="dialogueLegal" class="dialogue"></div>
  <div id="dialoguePirate" class="dialogue"></div>

</div>

<!-- =====================================================
     🎮 MINI-JEU 1 — AUTO-ENTREPRENEUR
===================================================== -->
<div id="miniGame"></div>

<!-- =====================================================
     🎮 MINI-JEU 2 — STATUT JURIDIQUE
===================================================== -->
<div id="miniGame2">
  <div id="game2Content"></div>
</div>

<!-- =====================================================
     🎮 MINI-JEU 3 — TVA (QCM)
===================================================== -->
<div id="miniGame3"></div>

<!-- =====================================================
     🎮 MINI-JEU 4 — COFFRE DE LA TVA (FINAL)
===================================================== -->
<div id="miniGame4"></div>

<!-- =====================================================
     ⚙️ SCRIPT PRINCIPAL
===================================================== -->
<script src="legal.js"></script>

</body>
</html>
