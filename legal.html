<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Quête Légale – KIT IN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="legal.css">
</head>
<body>

<!-- =====================================================
     🎬 VIDÉO INTRO
===================================================== -->
<div id="videoContainer">
  <video id="questVideo" preload="auto" autoplay muted>
    <source src="videos/Legalvideo.mov" type="video/mp4">
  </video>

  <!-- Boutons vidéo -->
  <div class="videoBtns">
    <button id="skipVideo">Passer la vidéo</button>
  </div>
</div>

<!-- =====================================================
     🌊 SCÈNE PRINCIPALE
===================================================== -->
<div id="scene" class="hidden">

  <!-- 🏴‍☠️ Pirate Légal -->
  <div id="pirateLegal" class="pirate">
    <img src="images/Piratelegal.PNG" alt="Pirate légal">
  </div>

  <!-- 🏴‍☠️ Pirate 1 -->
  <div id="pirate1" class="pirate">
    <img src="images/Pirate1.PNG" alt="Pirate">
  </div>

  <!-- 💬 Dialogues -->
  <div id="dialogueLegal" class="dialogue"></div>
  <div id="dialoguePirate" class="dialogue"></div>

</div>

<!-- =====================================================
     🎮 MINI-JEU 1 — AUTO-ENTREPRENEUR
===================================================== -->
<div id="miniGame">
  <h2>Les devoirs de l’auto-entrepreneur</h2>
  <div id="gameContent"></div>
</div>

<!-- =====================================================
     🎮 MINI-JEU 2 — STATUT JURIDIQUE
===================================================== -->
<div id="miniGame2">
  <h2>Choisir son statut juridique</h2>
  <div id="game2Content"></div>
</div>

<!-- =====================================================
     ⏳ LOADER PIRATE UNIQUE
===================================================== -->
<div id="loaderGame" class="loader" data-text="Chargement du mini jeu.."></div>

<!-- =====================================================
     💎 EXPLOSION DE GEMS
===================================================== -->
<div id="gems"></div>

<!-- =====================================================
     🎁 RÉCOMPENSE FINALE
===================================================== -->
<div id="reward">
  <img src="images/Statutsjuridiques.PNG" alt="Statuts juridiques">
</div>

<!-- =====================================================
     ⚙️ SCRIPT
===================================================== -->
<script src="legal.js"></script>

</body>
</html>
