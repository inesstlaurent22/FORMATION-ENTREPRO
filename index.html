<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>KIT IN – Quête du coffre</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="Fondindex">

  <img src="images/Fond1.PNG" class="fondindex" alt="fond">

  <!-- COFFRE -->
  <div class="tresor-button" id="tresor">
    <img src="images/Tresorfermer.png" class="tresor-img coffre-ferme">
    <img src="images/Tresorouvert.png" class="tresor-img coffre-ouvert">
  </div>

  <!-- LOADER -->
  <div id="loaderScreen">
    <p id="loaderText"></p>
  </div>

  <!-- MINI JEU -->
  <div id="mapGame">
    <h2 id="gameInstruction">
      Cliques sur les images pour reconstituer la carte entière
    </h2>

    <div id="mapPieces"></div>
  </div>

  <!-- VICTOIRE -->
  <div id="victoryScreen">
    <div class="victory-content">

      <h1 class="victory-text">
        Bravo Moussaillon, tu as réussi à ouvrir le trésor 🎁
      </h1>

      <img src="images/Carteminientier.jpg" class="full-map" alt="carte entière">

    </div>
  </div>

  <!-- VIDÉO -->
  <div id="videoContainer">
    <div id="soundToggle">🔉</div>
    <button id="closeVideo">✕</button>

    <video id="mainVideo" playsinline muted>
      <source src="video/Video1.MOV" type="video/mp4">
    </video>
  </div>

  <div id="cinematicFade"></div>
  <canvas id="gemCanvas"></canvas>

  <audio id="clickSound" src="sounds/click.mp3"></audio>
  <audio id="errorSound" src="sounds/error.mp3"></audio>

</div>

<script src="script.js"></script>
</body>
</html>
