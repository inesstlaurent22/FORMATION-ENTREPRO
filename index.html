<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIT IN</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="Fondindex">

  <!-- FONDS -->
  <img src="images/Fond1.PNG" class="fondindex fond-desktop" alt="">
  <img src="images/Fond1mobile.PNG" class="fondindex fond-mobile" alt="">

  <!-- COFFRE -->
  <div class="tresor-button" id="tresor">
    <img src="images/Tresorfermer.png" class="tresor-img ferme" alt="">
    <img src="images/Tresorouvert.png" class="tresor-img ouvert" alt="">
  </div>

  <!-- LOADER -->
  <div id="videoLoader">
    <div class="loader-icon">🏴‍☠️</div>
    <p>Ouverture du trésor…</p>
  </div>

  <!-- VIDÉO -->
  <div id="videoContainer">
    <button id="soundButton">🔊</button>
    <button id="closeVideo">✕</button>

    <video id="mainVideo" playsinline muted preload="auto">
      <source src="video/Video1.mp4" type="video/mp4">
    </video>
  </div>

  <!-- 💎 GEMES SVG -->
  <svg id="diamondLayer"></svg>

  <!-- OVERLAY -->
  <div id="cinematicOverlay"></div>

</div>

<script src="script.js"></script>
</body>
</html>
