<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIT IN</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="Fondindex">

  <!-- FOND -->
  <img src="images/Fond1.PNG" class="fondindex fond-desktop" alt="">
  <img src="images/Fond1mobile.PNG" class="fondindex fond-mobile" alt="">

  <!-- COFFRE -->
  <div id="tresor" class="tresor-button">
    <div class="tresor-inner">
      <img src="images/Tresorfermer.png" class="tresor-img ferme" alt="">
      <img src="images/Tresorouvert.png" class="tresor-img ouvert" alt="">
    </div>
  </div>

  <!-- MINI JEU -->
  <div id="mapGame">
    <div class="map-container">
      <h2>🗺️ Recompose la carte</h2>

      <div class="map-slots">
        <div class="slot" data-id="0"></div>
        <div class="slot" data-id="1"></div>
        <div class="slot" data-id="2"></div>
      </div>

      <div class="map-pieces">
        <img src="images/Carteminigauche.png" class="piece" draggable="true" data-id="0">
        <img src="images/Carteminijeuxmilieu.png" class="piece" draggable="true" data-id="1">
        <img src="images/Carteminijeuxdroite.png" class="piece" draggable="true" data-id="2">
      </div>
    </div>
  </div>

  <!-- FX -->
  <canvas id="fxCanvas"></canvas>

  <!-- FADE -->
  <div id="fade"></div>

  <!-- LOADER -->
  <div id="videoLoader">
    <div class="loader-icon">🏴‍☠️</div>
    <p>On ouvre le coffre…</p>
  </div>

  <!-- VIDEO -->
  <div id="videoContainer">
    <button id="soundButton" class="cinemaBtn">🔊</button>
    <button id="menuButton" class="cinemaBtn" onclick="location.href='menu.html'">✕</button>

    <video id="mainVideo" playsinline>
      <source src="video/Video1.mp4" type="video/mp4">
    </video>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
