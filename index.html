<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIT IN - Crée ton entreprise</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="Fondindex">

  <img src="images/Fond1.PNG" class="fondindex" alt="Fond">

  <!-- COFFRE -->
  <div class="tresor-button" id="tresor">
    <img src="images/Tresorfermer.png" class="tresor-img coffre-ferme">
    <img src="images/Tresorouvert.png" class="tresor-img coffre-ouvert">
  </div>

  <!-- MINI JEU -->
  <div id="mapGame">
    <h2>🗺️ Reconstitue la carte</h2>

    <div class="map-slots">
      <div class="slot" data-slot="1"></div>
      <div class="slot" data-slot="2"></div>
      <div class="slot" data-slot="3"></div>
    </div>

    <div class="map-pieces" id="piecesContainer">
      <img src="images/Carteminigauche.png" class="map-piece" draggable="true" data-order="1">
      <img src="images/Carteminimilieu.png" class="map-piece" draggable="true" data-order="2">
      <img src="images/Carteminidroite.png" class="map-piece" draggable="true" data-order="3">
    </div>

    <p id="mapMessage"></p>
  </div>

  <!-- LOADER -->
  <div id="loaderScreen">
    <div class="loader-content">
      <div class="loader-gem">🏴‍☠️</div>
      <p>Chargement du trésor…</p>
    </div>
  </div>

  <!-- VIDÉO -->
  <div id="videoContainer">
    <button id="closeVideo">✕</button>
    <video id="mainVideo" muted>
      <source src="video/Video1.mp4" type="video/mp4">
    </video>
  </div>

  <!-- SONS -->
  <audio id="clickSound" src="sounds/Clic.mp3"></audio>
  <audio id="errorSound" src="sounds/Erreur.mp3"></audio>

</div>

<script src="index.js"></script>
</body>
</html>
