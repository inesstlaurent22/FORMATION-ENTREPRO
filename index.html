<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Aventure Pirate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="Fondindex">
  <img src="img/fond.jpg" class="fondindex">

  <!-- Bouton Trésor -->
  <div class="tresor-button" id="tresorButton">
    <img src="img/coffre-ferme.png" class="tresor-img coffre-ferme">
    <img src="img/coffre-ouvert.png" class="tresor-img coffre-ouvert">
  </div>
</div>

<!-- Fade -->
<div id="fadeScreen"></div>

<!-- Loader -->
<div id="loaderScreen">
  <div class="loader-content">
    <div class="loader-logo">🏴‍☠️</div>
    <p id="loaderText">Gagne ce mini jeu pour commencer l’aventure</p>
  </div>
</div>

<!-- Mini Jeu -->
<div id="mapGame">
  <h2>Remets la carte dans le bon ordre</h2>
  <div class="map-pieces" id="mapPieces"></div>
</div>

<!-- Vidéo -->
<div id="videoContainer">
  <button id="closeVideo">✕</button>
  <video id="finalVideo" src="video/intro.mp4" controls></video>
</div>

<!-- Sons -->
<audio id="clickSound" src="sons/Clic.mp3"></audio>
<audio id="errorSound" src="sons/Erreur.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
