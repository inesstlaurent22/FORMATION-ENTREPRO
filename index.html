<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>KIT IN – Quête du coffre</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="Fondindex">

  <!-- FOND -->
  <img src="images/Fond1.PNG" class="fondindex">

  <!-- COFFRE -->
  <div class="tresor-button" id="tresor">
    <img src="images/Tresorfermer.png" class="tresor-img coffre-ferme">
    <img src="images/Tresorouvert.png" class="tresor-img coffre-ouvert">
  </div>

  <!-- FADE NOIR -->
  <div id="fadeScreen"></div>

  <!-- LOADER -->
  <div id="loaderScreen">
    <p id="loaderText">Gagne ce mini-jeux pour commencer ta quête 🥳</p>
  </div>

  <!-- MINI JEU -->
  <div id="mapGame">
    <h2 id="gameInstruction">
      cliques sur les images pour reconstituer la carte entière
    </h2>
    <div id="mapPieces"></div>
  </div>

  <!-- VICTOIRE -->
  <div id="victoryScreen">
    <h1>Bravo Moussaillon, tu as réussi à ouvrir le trésor</h1>
    <img src="images/Carteminientier.jpg" class="full-map">
  </div>

  <!-- VIDÉO -->
  <div id="videoContainer">
    <div id="soundToggle" class="circle-btn">🔊</div>
    <div id="exitVideo" class="circle-btn">✕</div>
    <video id="mainVideo" playsinline>
      <source src="video/Video1.mp4" type="video/mp4">
    </video>
  </div>

  <!-- CANVAS GEMS -->
  <canvas id="gemCanvas"></canvas>

  <!-- SONS -->
  <audio id="clickSound" src="sounds/click.mp3"></audio>
  <audio id="errorSound" src="sounds/error.mp3"></audio>

</div>

<script src="script.js"></script>
</body>
</html>
