<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>KIT IN - Crée ton entreprise</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="Fondindex">

  <img src="images/Fond1.PNG" class="fondindex">

  <!-- COFFRE -->
  <div class="tresor-button" id="tresor">
    <img src="images/Tresorfermer.png" class="tresor-img coffre-ferme">
    <img src="images/Tresorouvert.png" class="tresor-img coffre-ouvert">
  </div>

  <!-- MINI JEU -->
  <div id="mapGame">
    <div id="mapPieces"></div>
  </div>

  <!-- ÉCRAN DE VICTOIRE -->
<div id="victoryScreen">
  <h2>Bravo tu as réussi à ouvrir le coffre 🎁</h2>
  <img src="images/Carteminientier.jpg" alt="Carte complète">
</div>

  <!-- LOADER -->
  <div id="loaderScreen">
    <div class="loader-content">
      <div class="loader-gem">💎</div>
      <p id="loaderText">Le coffre s’ouvre…</p>
    </div>
  </div>

  <!-- VIDÉO -->
  <div id="videoContainer">
    <button id="closeVideo">✕</button>
    <video id="mainVideo" muted playsinline>
      <source src="video/Video1.MOV" type="video/mp4">
    </video>
  </div>

  <!-- CANVAS -->
  <canvas id="gemCanvas"></canvas>

  <!-- SONS -->
  <audio id="clickSound" src="sounds/click.mp3"></audio>
  <audio id="errorSound" src="sounds/error.mp3"></audio>

</div>

<script src="script.js"></script>
</body>
</html>
