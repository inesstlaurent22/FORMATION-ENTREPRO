<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIT IN – Aventure Pirate</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- SCÈNE -->
<div class="Fondindex">
  <img src="images/Fond1.PNG" class="fondindex" alt="Fond">

  <!-- COFFRE -->
  <div class="tresor-button" id="tresorButton">
    <img src="images/Tresorfermer.png" class="tresor-img coffre-ferme">
    <img src="images/Tresorouvert.png" class="tresor-img coffre-ouvert">
  </div>
</div>

<!-- CANVAS GEMS -->
<canvas id="gemCanvas"></canvas>

<!-- FADE -->
<div id="fadeScreen"></div>

<!-- LOADER -->
<div id="loaderScreen">
  <div class="loader-content">
    <div class="loader-gem">🏴‍☠️</div>
    <p id="loaderText">Chargement…</p>
  </div>
</div>

<!-- MINI JEU -->
<div id="mapGame">
  <h2>🗺️ Reconstitue la carte au trésor</h2>
  <div class="map-pieces" id="mapPieces"></div>
</div>

<!-- VIDÉO -->
<div id="videoContainer">
  <button id="closeVideo">✕</button>
  <video id="mainVideo" playsinline muted preload="auto">
    <source src="video/Video1.mp4" type="video/mp4">
  </video>
</div>

<!-- SONS -->
<audio id="clickSound" src="sons/Clic.mp3"></audio>
<audio id="errorSound" src="sons/Erreur.mp3"></audio>

<script src="index.js"></script>
</body>
</html>
