<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIT IN</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="Fondindex">

  <!-- FONDS -->
  <img src="images/Fond1.PNG" class="fondindex fond-desktop">
  <img src="images/Fond1mobile.PNG" class="fondindex fond-mobile">

  <!-- COFFRE -->
  <div class="tresor-button" id="tresor">
    <img src="images/Tresorfermer.png" class="tresor-img ferme">
    <img src="images/Tresorouvert.png" class="tresor-img ouvert">
  </div>

  <!-- MINI JEU -->
  <div id="miniGame">
    <div class="scroll">
      <h2>⚓ LE SERMENT DU PIRATE ⚓</h2>
      <p>Mémorise l’ordre sacré</p>
      <div class="symbols">
        <button data-id="0">☠️</button>
        <button data-id="1">⚓</button>
        <button data-id="2">🗺️</button>
      </div>
      <p id="gameMessage"></p>
    </div>
  </div>

  <!-- CANVAS PARTICULES -->
  <canvas id="fxCanvas"></canvas>

  <!-- LOADER -->
  <div id="videoLoader">
    <div class="loader-icon">🏴‍☠️</div>
    <p>Ouverture du trésor…</p>
  </div>

  <!-- VIDÉO -->
  <div id="videoContainer">
    <button id="soundButton">🔊</button>
    <button id="closeVideo">✕</button>
    <video id="mainVideo" muted playsinline>
      <source src="video/Video1.mp4" type="video/mp4">
    </video>
  </div>

  <div id="cinematicOverlay"></div>

</div>

<script src="script.js"></script>
</body>
</html>
