<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIT IN - Crée ton entreprise</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- CANVAS PARTICULES (PIERRES PRÉCIEUSES) -->
  <canvas id="gemCanvas"></canvas>

  <!-- CONTENEUR GLOBAL -->
  <div class="Fondindex">

    <!-- IMAGE DE FOND -->
    <img src="images/Fond1.PNG" alt="Fond" class="fondindex">

    <!-- COFFRE -->
    <div class="buttons-container">
      <div class="tresor-button" id="tresor">

        <!-- Coffre fermé -->
        <img src="images/Tresorfermer.png"
             alt="Coffre fermé"
             class="tresor-img coffre-ferme">

        <!-- Coffre ouvert -->
        <img src="images/Tresorouvert.png"
             alt="Coffre ouvert"
             class="tresor-img coffre-ouvert">

      </div>
    </div>

    <!-- VIDÉO -->
    <div id="videoContainer">
      <video id="mainVideo" controls></video>
      <button id="closeVideo">✕</button>
    </div>

  </div>

  <!-- SCRIPT -->
  <script>
    /* ===================== */
    /* VIDÉO */
    /* ===================== */
    const tresor = document.getElementById('tresor');
    const videoContainer = document.getElementById('videoContainer');
    const mainVideo = document.getElementById('mainVideo');
    const closeVideo = document.getElementById('closeVideo');

    tresor.addEventListener('click', () => {
      mainVideo.src = 'video/Video1.MOV';
      videoContainer.style.display = 'flex';
      mainVideo.play();
    });

    closeVideo.addEventListener('click', closeVideoHandler);

    videoContainer.addEventListener('click', (e) => {
      if (e.target === videoContainer) closeVideoHandler();
    });

    mainVideo.addEventListener('ended', () => {
      window.location.href = 'menu.html';
    });

    function closeVideoHandler() {
      mainVideo.pause();
      mainVideo.src = '';
      videoContainer.style.display = 'none';
      window.location.href = 'menu.html';
    }

    /* ===================== */
    /* 💥 PARTICULES PHYSIQUES */
    /* ===================== */
    const canvas = document.getElementById('gemCanvas');
    const ctx = canvas.getContext('2d');

    let gems = [];
    const gravity = 0.45;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    class Gem {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 12;
        this.vy = Math.random() * -14 - 6;
        this.size = Math.random() * 6 + 4;
        this.rotation = Math.random() * Math.PI;
        this.spin = (Math.random() - 0.5) * 0.25;
        this.life = 1;

        this.color = [
          '#00e5ff',
          '#ff4081',
          '#7c4dff',
          '#00e676',
          '#ffd600'
        ][Math.floor(Math.random() * 5)];
      }

      update() {
        this.vy += gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.rotation += this.spin;
        this.life -= 0.015;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;

        ctx.beginPath();
        ctx.moveTo(0, -this.size);
        ctx.lineTo(this.size, 0);
        ctx.lineTo(0, this.size);
        ctx.lineTo(-this.size, 0);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }
    }

    function explode(x, y) {
      for (let i = 0; i < 60; i++) {
        gems.push(new Gem(x, y));
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      gems = gems.filter(g => g.life > 0);
      gems.forEach(g => {
        g.update();
        g.draw();
      });
      requestAnimationFrame(animate);
    }
    animate();

    function triggerExplosion() {
      const rect = tresor.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;
      explode(x, y);
      tresor.classList.add('active');
    }

    tresor.addEventListener('click', triggerExplosion);
    tresor.addEventListener('touchstart', triggerExplosion, { passive: true });
  </script>

</body>
</html>
