<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIT IN</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="Fondindex">

  <!-- FOND -->
  <img src="images/Fond1.PNG" class="fondindex fond-desktop">
  <img src="images/Fond1mobile.PNG" class="fondindex fond-mobile">

  <!-- COFFRE -->
  <div id="tresor" class="tresor-button">
    <img src="images/Tresorfermer.png" class="tresor-img ferme">
    <img src="images/Tresorouvert.png" class="tresor-img ouvert">
  </div>

  <!-- MINI JEU CARTE -->
  <div id="mapGame">
    <div class="map-container">

      <h2>🗺️ Recompose la carte du trésor</h2>

      <!-- EMPLACEMENTS -->
      <div class="map-slots">
        <div class="slot" data-id="0"></div>
        <div class="slot" data-id="1"></div>
        <div class="slot" data-id="2"></div>
      </div>

      <!-- PIÈCES -->
      <div class="map-pieces">
        <img src="images/Carteminijeuxgauche.png" class="piece" data-id="1">
        <img src="images/Carteminijeuxmillieu.png" class="piece" data-id="2">
        <img src="images/Carteminijeuxdroite.png" class="piece" data-id="0">
      </div>

      <p id="mapMessage"></p>

    </div>
  </div>

  <!-- CANVAS FX -->
  <canvas id="fxCanvas"></canvas>

  <!-- FADE -->
  <div id="fade"></div>

  <!-- LOADER -->
  <div id="videoLoader">
    <div class="loader-icon">🏴‍☠️</div>
    <p>Ouverture du trésor…</p>
  </div>

  <!-- VIDEO -->
  <div id="videoContainer">
    <button id="soundButton" class="cinemaBtn">🔊</button>
    <button id="menuButton" class="cinemaBtn">✕</button>
    <video id="mainVideo" muted playsinline>
      <source src="video/Video1.mp4" type="video/mp4">
    </video>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
