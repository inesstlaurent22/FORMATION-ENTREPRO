<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIT IN - Crée ton entreprise</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- CANVAS PARTICULES -->
  <canvas id="gemCanvas"></canvas>

  <!-- OVERLAY CINÉMATIQUE -->
  <div id="cinematicOverlay"></div>

  <!-- CONTENEUR GLOBAL -->
  <div class="Fondindex">

    <!-- IMAGE DE FOND -->
    <img src="images/Fond1.PNG" alt="Fond" class="fondindex">

    <!-- COFFRE -->
    <div class="tresor-button" id="tresor">

      <img src="images/Tresorfermer.png"
           alt="Coffre fermé"
           class="tresor-img coffre-ferme">

      <img src="images/Tresorouvert.png"
           alt="Coffre ouvert"
           class="tresor-img coffre-ouvert">

    </div>

    <!-- VIDÉO -->
    <div id="videoContainer">
      <button id="closeVideo">✕</button>
      <video id="mainVideo" playsinline preload="auto"></video>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
