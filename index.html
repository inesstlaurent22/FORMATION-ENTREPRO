<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIT IN - Crée ton entreprise</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- CONTENEUR GLOBAL -->
  <div class="Fondindex">

    <!-- IMAGE DE FOND -->
    <img src="images/Fond1.PNG" alt="Fond" class="fondindex">

    <!-- COFFRE -->
    <div class="buttons-container">
      <div class="tresor-button" id="tresor">

        <!-- Particules -->
        <div class="gold-particles"></div>

        <!-- Coffre fermé -->
        <img src="images/Tresorfermer.png"
             alt="Coffre fermé"
             class="tresor-img coffre-ferme">

        <!-- Coffre ouvert -->
        <img src="images/Tresorouvert.png"
             alt="Coffre ouvert"
             class="tresor-img coffre-ouvert">

      </div>
    </div>

    <!-- VIDÉO -->
    <div id="videoContainer">
      <video id="mainVideo" controls></video>
      <button id="closeVideo">✕</button>
    </div>

  </div>

  <!-- SCRIPT -->
  <script>
    const tresor = document.getElementById('tresor');
    const videoContainer = document.getElementById('videoContainer');
    const mainVideo = document.getElementById('mainVideo');
    const closeVideo = document.getElementById('closeVideo');

    tresor.addEventListener('click', () => {
      mainVideo.src = 'video/Video1.MOV';
      videoContainer.style.display = 'flex';
      mainVideo.play();
    });

    closeVideo.addEventListener('click', closeVideoHandler);

    videoContainer.addEventListener('click', (e) => {
      if (e.target === videoContainer) closeVideoHandler();
    });

    mainVideo.addEventListener('ended', () => {
      window.location.href = 'menu.html';
    });

    function closeVideoHandler() {
      mainVideo.pause();
      mainVideo.src = '';
      videoContainer.style.display = 'none';
      window.location.href = 'menu.html';
    }
  </script>

</body>
</html>
