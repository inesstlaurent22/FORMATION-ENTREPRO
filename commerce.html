<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Quête Commerce</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="commerce.css">
</head>

<body>

<!-- ================= 🎬 VIDÉO ================= -->
<div id="videoContainer">
  <video id="questVideo" autoplay muted playsinline>
    <source src="videos/Commercevideo.MOV" type="video/mp4">
  </video>

  <div id="videoControls">
    <button id="toggleSound" aria-label="Son">🔇</button>
    <button id="closeVideo" aria-label="Fermer">✖</button>
  </div>
</div>

<!-- ================= 🌅 BACKGROUND ================= -->
<div id="background">
  <img src="images/Commercefond.PNG" class="fondImage">

  <img id="pirate2bis" class="pirate hidden" src="images/Pirate2.png">
  <img id="pirate5bis" class="pirate hidden" src="images/Pirate5.png">
  <img id="pirate3bis" class="pirate hidden" src="images/Pirateclients.png">
</div>

<!-- ================= 💬 BULLES ================= -->
<div id="bubbleContainer"></div>
<button id="skipDialoguesBtn">Passer les dialogues</button>

<!-- ================= 🌑 LOADER ================= -->
<div id="fadeScreen">
  <div class="loaderBox">Chargement...</div>
</div>

<!-- ================= 🎮 MINI-JEU ================= -->
<div id="miniGameContainer">
  <div id="gameQuestion"></div>
  <div id="gameAnswers"></div>
  <div id="gameFeedback"></div>
</div>

<!-- ================= 📖 LIVRE ================= -->
<div id="bookContainer">
  <div class="book">
    <div class="page left"><img id="leftPage"></div>
    <div class="page right"><img id="rightPage"></div>
  </div>
  <button id="continueQuestBtn">Continuer la quête</button>
</div>

<!-- ================= 🏁 FIN ================= -->
<div id="endScreen">
  <h1>Bravo, tu as gagné la quête 🎆</h1>
</div>

<script src="commerce.js"></script>
</body>
</html>
