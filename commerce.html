<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Quête Commerce</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="commerce.css">
</head>

<body>

<!-- ================= BACKGROUND ================= -->
<div id="background">
  <img src="images/Commercefond.PNG" class="fondImage">

  <img id="pirate2bis" class="pirate" src="images/Pirate2.png">
  <img id="pirate5bis" class="pirate" src="images/Pirate5.png">
  <img id="pirate3bis" class="pirate hidden" src="images/Pirateclients.png">
</div>

<!-- ================= BULLES ================= -->
<div id="bubbleContainer"></div>

<!-- ================= FADE / LOADER ================= -->
<div id="fadeScreen">
  <div class="loaderBox"></div>
</div>

<!-- ================= FIN DE QUÊTE ================= -->
<div id="endScreen" class="hidden">
  <h1 id="endTitle">Bravo tu as gagné la quête</h1>
  <p id="endSubtitle"></p>

  <div id="rewardBubbles">
    <div class="rewardBubble">
      <img src="images/vignette1.png">
      <span>Une échoppe</span>
    </div>
    <div class="rewardBubble">
      <img src="images/vignette2.png">
      <span>Des boites en bois</span>
    </div>
    <div class="rewardBubble">
      <img src="images/vignette3.PNG">
      <span>Une réputation sur le marché</span>
    </div>
  </div>
</div>

<script src="commerce.js"></script>
</body>
</html>
