<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>QUÊTE 1 : COMMERCE</title>
  <link rel="stylesheet" href="commerce.css">
</head>

<body>

<!-- ⬇️ FONDU VIDEO -->
<div id="videoOverlay" class="overlay visible">
  <video id="introVideo" src="videos/commerceVideo.MOV" autoplay></video>
</div>

<!-- ⬇️ FONDU MESSAGE GAIN -->
<div id="winOverlay" class="overlay hidden">
  <div class="win-box">Bravo tu as gagné 5000 PO 💰</div>
</div>

<!-- ⬇️ CONTENU PRINCIPAL -->
<div id="scene" class="hidden">

  <img src="images/fondCommerce.png" class="background">

  <img id="pirate1" src="images/pirate1.png" class="pirate">
  <img id="pirate5bis" src="images/pirate5bis.png" class="pirate">

  <!-- BULLES DE TEXTE -->
  <div id="dialogueBox" class="bubble hidden">
    <p id="dialogueText"></p>
  </div>

  <!-- BOUTON MINI JEU (APPARAÎT APRÈS DERNIÈRE BULLE) -->
  <button id="startMiniGameBtn" class="hidden">Commencer le mini-jeu</button>

</div>

<!-- ⬇️ MINI JEU -->
<div id="miniGame" class="hidden">
  <div class="game-box">
    <p>Mini-jeu : Clique sur le coffre gagnant</p>
    <img class="coffre" data-win="false" src="images/coffre1.png">
    <img class="coffre" data-win="true" src="images/coffre2.png">
    <img class="coffre" data-win="false" src="images/coffre3.png">
  </div>
</div>

<script src="commerce.js"></script>
</body>
</html>
