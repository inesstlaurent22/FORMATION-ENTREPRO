<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Marché Pirate – Quête Commerce</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="commerce.css">
</head>

<body>

<!-- =====================================================
     🎬 VIDÉO D’INTRO
===================================================== -->
<div id="videoContainer">
  <video id="questVideo" autoplay playsinline>
    <source src="videos/intro.mp4" type="video/mp4">
  </video>

  <div id="videoControls">
    <button id="toggleSound">🔇</button>
    <button id="closeVideo">✖</button>
  </div>
</div>

<!-- =====================================================
     🌄 BACKGROUND
===================================================== -->
<img id="background" class="hidden" src="images/marche_pirate_bg.png" alt="Marché pirate">

<!-- =====================================================
     🏴‍☠️ PIRATES
===================================================== -->
<img id="pirate2bis" class="hidden" src="images/pirate2.png" alt="Pirate 2">
<img id="pirate5bis" class="hidden" src="images/pirate5.png" alt="Pirate 5">
<img id="pirate3bis" class="hidden" src="images/pirate3.png" alt="Pirate 3">

<!-- =====================================================
     💬 BULLES DE DIALOGUE
===================================================== -->
<div id="bubbleContainer"></div>

<!-- =====================================================
     🎮 MINI-JEU QUIZ
===================================================== -->
<div id="miniGameContainer" class="hidden">
  <div class="gameBox">
    <h2 id="gameQuestion"></h2>
    <div id="gameAnswers"></div>
    <div id="gameFeedback"></div>
  </div>
</div>

<!-- =====================================================
     ⏳ FADE / LOADER / RÉCOMPENSE
===================================================== -->
<div id="fadeScreen" class="hidden">
  <div class="loaderBox"></div>
</div>

<!-- =====================================================
     📖 LIVRE / BUSINESS PLAN
===================================================== -->
<div id="bookContainer" class="hidden">
  <!-- Le titre lumineux est injecté en JS -->
  <img id="leftPage" src="" alt="Business Plan">
  <button id="continueQuestBtn" class="hidden">
    Continuer la quête
  </button>
</div>

<!-- =====================================================
     🎮 MINI-JEU MARCHAND
===================================================== -->
<div id="merchantGame" class="hidden">
  <div class="merchantBox">
    <h2>Le Jugement du Marché</h2>

    <p id="clue"></p>

    <div class="merchantActions">
      <button onclick="analyzeClient()">Analyser le marché</button>
      <button onclick="lowerPrice()">Baisser le prix</button>
      <button onclick="keepPrice()">Garder le prix</button>
    </div>
  </div>
</div>

<!-- =====================================================
     📜 JS
===================================================== -->
<script src="commerce.js"></script>

</body>
</html>
