<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Le Marché des Trésors</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="commerce.css">
</head>

<body>

<!-- ================= VIDEO ================= -->
<div id="videoContainer">
  <video id="questVideo" autoplay muted playsinline>
    <source src="video/intro.mp4" type="video/mp4">
  </video>

  <div id="videoControls">
    <button id="toggleSound">🔇</button>
    <button id="closeVideo">✖</button>
  </div>
</div>

<!-- ================= LOADER GLOBAL ================= -->
<div id="fadeScreen" class="hidden">
  <div class="loaderBox">Chargement...</div>
</div>

<!-- ================= SABLIER GLOBAL ================= -->
<div id="bookLoader" class="hidden">
  <div class="hourglass">⏳</div>
  <div class="loaderText">Chargement du grimoire...</div>
</div>

<!-- ================= BACKGROUND ================= -->
<div id="background" class="hidden">
  <img src="images/fond.png" class="fondImage">
</div>

<!-- ================= PIRATES ================= -->
<img id="pirate2bis" class="pirate hidden" src="images/pirate2.png">
<img id="pirate5bis" class="pirate hidden" src="images/pirate5.png">
<img id="pirate3bis" class="pirate hidden" src="images/pirate3.png">

<!-- ================= DIALOGUES ================= -->
<div id="bubbleContainer"></div>
<button id="skipDialoguesBtn" class="hidden">Passer</button>

<!-- ================= MINI JEU 1 ================= -->
<div id="miniGameContainer" class="hidden">
  <div class="quizBox">
    <div class="quizTitle">⚔️ Défi du capitaine</div>
    <p id="gameQuestion"></p>
    <div id="gameAnswers"></div>
    <div id="gameFeedback"></div>
  </div>
</div>

<!-- ================= LIVRE ================= -->
<div id="bookContainer" class="hidden">
  <h1 id="bookTitle">📖 Le Grimoire</h1>

  <div class="book">
    <div class="page left">
      <img id="leftPage">
    </div>

    <div class="page right">
      <img id="rightPage">
      <div class="pageCurl"></div>
    </div>
  </div>

  <button id="continueQuestBtn" class="hidden">Continuer</button>
</div>

<!-- ================= MINI JEU 2 ================= -->
<div id="merchantGame" class="hidden">
  <div id="game">
    <h1>⚖️ Le choix du marchand</h1>
    <p id="clue"></p>
    <button id="btnHint">Indice</button>
    <button id="btnKeep">Maintenir le prix</button>
    <button id="btnLower">Baisser le prix</button>
  </div>
</div>

<script src="commerce.js"></script>

</body>
</html>
