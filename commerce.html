<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Quête Commerce</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="commerce.css">
</head>

<body>

<!-- ================= 🎬 VIDÉO ================= -->
<div id="videoContainer">
  <video id="questVideo" autoplay muted playsinline preload="auto">
    <source src="videos/Commercevideo.MOV" type="video/mp4">
  </video>

  <div id="videoControls">
    <button id="toggleSound">🔇</button>
    <button id="closeVideo">✖</button>
  </div>
</div>

<!-- ================= 🌅 BACKGROUND ================= -->
<div id="background" class="hidden">
  <img src="images/Commercefond.PNG" class="fondImage" alt="Fond du marché pirate">

  <img
    id="pirate2bis"
    class="pirate hidden"
    src="images/Pirate2.png"
    alt="Pirate apprenti"
  >

  <img
    id="pirate5bis"
    class="pirate hidden"
    src="images/Pirate5.png"
    alt="Maître pirate"
  >

  <img
    id="pirate3bis"
    class="pirate hidden"
    src="images/Pirateclients.png"
    alt="Pirate client"
  >
</div>

<!-- ================= 💬 BULLES ================= -->
<div id="bubbleContainer"></div>
<button id="skipDialoguesBtn">Passer les dialogues</button>

<!-- ================= 🌑 FADE / LOADER ================= -->
<div id="fadeScreen" class="hidden">
  <div class="loaderBox">Chargement...</div>
</div>

<!-- ================= 🎮 MINI-JEUX ================= -->
<div id="miniGameContainer" class="hidden">
  <div class="quizBox">
    <div id="gameQuestion"></div>
    <div id="gameAnswers"></div>
    <div id="gameFeedback"></div>
  </div>
</div>

<!-- ================= 📖 LIVRE ================= -->
<div id="bookContainer" class="hidden">
  <div class="book">
    <div class="page left">
      <img id="leftPage" alt="Page gauche">
    </div>
    <div class="page right">
      <img id="rightPage" alt="Page droite">
    </div>
  </div>

  <button id="continueQuestBtn">Continuer la quête</button>
</div>

<!-- ================= 🏁 FIN ================= -->
<div id="endScreen" class="hidden">
  <h1 id="endTitle">Bravo, tu as gagné la quête</h1>
</div>

<script src="commerce.js"></script>
</body>
</html>
