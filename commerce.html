<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Quête Commerce</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="commerce.css">
</head>

<body>

<!-- 🎬 CONTAINER VIDÉO -->
<div id="videoContainer">
  <video
    id="questVideo"
    autoplay
    muted
    playsinline
    preload="auto"
  >
    <source src="videos/Commercevideo.MOV" type="video/mp4">
  </video>

  <div id="videoControls">
    <button id="toggleSound">🔇</button>
    <button id="closeVideo">✖</button>
  </div>
</div>

<!-- 🌅 BACKGROUND + PIRATES -->
<div id="background">
  <img src="images/Commercefond.PNG" class="fondImage">
  <img id="pirate2bis" class="pirate" src="images/Pirate2.png">
  <img id="pirate5bis" class="pirate" src="images/Pirate5.png">
</div>

<!-- 💬 BULLES -->
<div id="bubbleContainer"></div>

<!-- 🌑 FADE + LOADER -->
<div id="fadeScreen">
  <div class="loaderBox">
    Termine ce mini-jeu pour continuer ta quête
  </div>
</div>

<!-- 🎮 MINI JEU -->
<div id="miniGameContainer">
  <div id="gameQuestion"></div>
  <div id="gameAnswers"></div>
  <div id="gameFeedback"></div>
</div>

<!-- 🏆 RÉCOMPENSE -->
<div id="rewardScreen">
  <div class="rays"></div>
  <div class="rewardBox">
    <strong>Bravo !</strong><br>
    Tu as gagné <strong>5000 PO</strong><br>
    et ton <strong>Business Plan</strong>
  </div>
</div>

<!-- 📖 LIVRE -->
<div id="bookContainer">
  <div class="book">
    <div class="page">
      <div class="front" style="background-image:url('images/Businessplan1.jpg')"></div>
      <div class="back" style="background-image:url('images/Businessplan4.jpg')"></div>
    </div>
    <div class="page">
      <div class="front" style="background-image:url('images/Businessplan2.jpg')"></div>
      <div class="back" style="background-image:url('images/Businessplan4.jpg')"></div>
    </div>
    <div class="page">
      <div class="front" style="background-image:url('images/Businessplan3.jpg')"></div>
      <div class="back" style="background-image:url('images/Businessplan4.jpg')"></div>
    </div>
  </div>
</div>

<!-- ▶️ CONTINUER -->
<button id="continueQuestBtn">Continuer ta quête</button>

<script src="commerce.js"></script>
</body>
</html>
