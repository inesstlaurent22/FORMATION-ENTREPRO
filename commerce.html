<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Quête – Le Marché des Trésors</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="commerce.css">
</head>

<body>

<!-- =====================================================
     🎬 VIDÉO D’INTRO
===================================================== -->
<div id="videoContainer">
  <video id="questVideo" src="video/intro.mp4" autoplay muted></video>

<div id="videoControls">
  <button id="toggleSound">🔇</button>
  <button id="closeVideo">Passer la vidéo</button>
</div>
</div>

<!-- =====================================================
     🌅 BACKGROUND
===================================================== -->
<div id="background" class="hidden">
  <img src="images/commerce_background.png" class="fondImage" alt="Marché pirate">
</div>

<!-- =====================================================
     🏴‍☠️ PIRATES
===================================================== -->
<img src="images/pirate2bis.png"
     id="pirate2bis"
     class="pirate hidden"
     alt="Pirate 2">

<img src="images/pirate3bis.png"
     id="pirate3bis"
     class="pirate hidden"
     alt="Pirate 3">

<img src="images/pirate5bis.png"
     id="pirate5bis"
     class="pirate hidden"
     alt="Pirate 5">

<!-- =====================================================
     💬 BULLES DE DIALOGUE
===================================================== -->
<div id="bubbleContainer"></div>

<!-- =====================================================
     🎮 MINI-JEUX
===================================================== -->
<div id="miniGameContainer" class="hidden">
  <div class="quizBox">
    <div class="quizTitle">La création de ton business plan</div>
    <div class="quizSeparator"></div>

    <div id="gameQuestion"></div>
    <div id="gameAnswers"></div>
  </div>
</div>

<!-- =====================================================
     🌑 LOADER / VICTOIRE
===================================================== -->
<div id="fadeScreen" class="hidden">
  <div class="loaderBox">
    Chargement…
  </div>
</div>

<!-- =====================================================
     JS
===================================================== -->
<script src="commerce.js"></script>

</body>
</html>
