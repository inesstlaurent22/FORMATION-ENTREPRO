<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Quête Commerce</title>
  <link rel="stylesheet" href="commerce.css" />
</head>

<body>

<!-- VIDÉO -->
<div id="videoContainer">
  <video id="questVideo" src="videos/Commercevideo.MOV" preload="auto" playsinline webkit-playsinline></video>

  <div id="videoControls">
    <button id="toggleSound">🔊</button>
    <button id="closeVideo">✖</button>
  </div>
</div>

<!-- BOUTONS APRÈS VIDÉO -->
<div id="buttonsContainer">
  <button id="replayVideo" class="topLeft">⟲ Revoir la vidéo</button>
  <button id="finishQuest" class="topRight">🚩 Terminer la quête</button>
</div>

<!-- FOND + PIRATES -->
<div id="background">
  <img src="images/Commercefond.PNG" class="fondImage">

  <img id="pirate2bis" class="pirate" src="images/Pirate2.png">
  <img id="pirate5bis" class="pirate" src="images/Pirate5.png">
</div>

<!-- BULLES -->
<div id="bubbleContainer"></div>

  <!-- OVERLAY FLOU -->
<div id="overlayBlur"></div>

<!-- MINI JEU POPUP -->
<div id="miniGameContainer">

  <div id="introText">
    Les pirates doivent convaincre leur tante de leur prêter de l’or.<br>
    Réponds correctement pour les aider 🏴‍☠️
  </div>

  <div id="miniGameContent">
    <p id="gameQuestion"></p>
    <div id="gameAnswers"></div>
    <p id="gameFeedback"></p>
  </div>

</div>

<!-- ÉCRAN DE VICTOIRE -->
<div id="victoryScreen">
  <div class="victoryBox">
    <h2>🎉 Bravo tu as gagné : <strong>5000 PO</strong> !</h2>
    <img src="images/pieces_pirates.png" class="coinLogo">
  </div>
</div>

<script src="commerce.js"></script>

</body>
</html>
