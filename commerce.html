<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Quête Commerce</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="commerce.css">
</head>

<body>

<!-- ================= 🎬 VIDÉO ================= -->
<div id="videoContainer">
  <video id="questVideo" autoplay muted playsinline preload="auto">
    <source src="videos/Commercevideo.MOV" type="video/mp4">
  </video>

  <div id="videoControls">
    <button id="toggleSound">🔇</button>
    <button id="closeVideo">✖</button>
  </div>
</div>

<!-- ================= 🌅 BACKGROUND ================= -->
<div id="background">
  <img src="images/Commercefond.PNG" class="fondImage">

  <img id="pirate2bis" class="pirate" src="images/Pirate2.png">
  <img id="pirate5bis" class="pirate" src="images/Pirate5.png">
</div>

<!-- ================= 💬 DIALOGUES ================= -->
<div id="bubbleContainer"></div>

<!-- ================= 🌑 FADE ================= -->
<div id="fadeScreen">
  <div class="loaderBox"></div>
</div>

<!-- ================= 🎮 MINI-JEU ================= -->
<div id="miniGameContainer">
  <div class="quizBox">
    <div id="multiHint"></div>
    <div id="gameQuestion"></div>
    <div id="gameAnswers"></div>
    <div id="counter"></div>
  </div>
</div>

<!-- ================= 🏆 RÉCOMPENSE ================= -->
<div id="rewardScreen">
  <div class="rays"></div>
  <div class="rewardBox">
    Bravo ! Tu as gagné <br><br>
    5000 PO 💰<br>
    Business Plan 📔
  </div>
</div>

<!-- ================= 📖 LIVRE ================= -->
<div id="bookContainer">
  <div id="bookTitle">Ton business plan est prêt</div>

  <div class="book">
    <div class="page left">
      <img id="leftPage">
    </div>
    <div class="page right">
      <img id="rightPage">
    </div>
  </div>
</div>

<button id="continueQuestBtn">Continue ta quête</button>

<script src="commerce.js"></script>
</body>
</html>
