<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Quête Commerce</title>

  <!-- Mobile first -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- CSS -->
  <link rel="stylesheet" href="commerce.css">
</head>

<body>

<!-- =====================================================
     🎬 VIDÉO D’INTRO
===================================================== -->
<div id="videoContainer">
  <video
    id="questVideo"
    muted
    autoplay
    playsinline
    preload="auto"
  >
    <source src="videos/Commercevideo.MOV" type="video/mp4">
    Votre navigateur ne supporte pas la vidéo.
  </video>

  <div id="videoControls">
    <button id="toggleSound" aria-label="Activer le son">🔇</button>
    <button id="closeVideo" aria-label="Passer la vidéo">Passer</button>
  </div>
</div>

<!-- =====================================================
     🌅 BACKGROUND + PIRATES
===================================================== -->
<div id="background" class="hidden">

  <img
    src="images/Commercefond.PNG"
    class="fondImage"
    alt="Fond du marché pirate"
  >

  <!-- Pirate apprenti -->
  <img
    id="pirate2bis"
    class="pirate hidden"
    src="images/Pirate2.png"
    alt="Pirate apprenti"
    draggable="false"
  >

  <!-- Pirate maître -->
  <img
    id="pirate5bis"
    class="pirate hidden"
    src="images/Pirate5.png"
    alt="Pirate maître"
    draggable="false"
  >

  <!-- Pirate client -->
  <img
    id="pirate3bis"
    class="pirate hidden"
    src="images/Pirateclients.png"
    alt="Pirate client"
    draggable="false"
  >

</div>

<!-- =====================================================
     💬 BULLES DE DIALOGUE
===================================================== -->
<div id="bubbleContainer"></div>

<!-- =====================================================
     🎮 MINI-JEU 1 — QUIZ PIRATE
===================================================== -->
<div id="miniGameContainer" class="hidden" aria-hidden="true">
  <div class="quizBox">
    <div id="gameQuestion"></div>
    <div id="gameAnswers"></div>
    <div id="gameFeedback"></div>
  </div>
</div>

<!-- =====================================================
     ⏳ FADE / LOADER / RÉCOMPENSE
===================================================== -->
<div id="fadeScreen" class="hidden" aria-hidden="true">
  <div class="loaderBox">Chargement…</div>
</div>

<!-- =====================================================
     📖 LIVRE DIGITAL
===================================================== -->
<div id="bookContainer" class="hidden" aria-hidden="true">

  <div class="book">
    <div class="page">
      <img
        id="leftPage"
        src=""
        alt="Page du business plan"
        draggable="false"
      >
    </div>
  </div>

  <button
    id="continueQuestBtn"
    class="hidden"
    aria-label="Continuer la quête"
  >
    Continuer la quête
  </button>

</div>

<!-- =====================================================
     🎮 MINI-JEU 2 — LE JUGEMENT DU MARCHÉ
===================================================== -->
<div id="merchantGame" class="hidden" aria-hidden="true">

  <div id="game">

    <h1>🧔‍♂️ Le Jugement du Marché</h1>

    <p>📦 Prix de l’objet :
      <strong><span id="price">300</span> PO</strong>
    </p>

    <p>🏷️ Prix des concurrents :
      <strong><span id="exp">250</span> PO</strong>
    </p>

    <div id="dialogue">
      <p id="clientText">
        « J’ai vu cet objet à moitié prix dans un autre port… »
      </p>
    </div>

    <div id="clue"></div>

    <div id="buttons">
      <button type="button">💡 Indice</button>
      <button type="button">💰 Baisser le prix</button>
      <button type="button">⚖️ Maintenir le prix</button>
    </div>

  </div>
</div>

<!-- =====================================================
     📜 SCRIPT
===================================================== -->
<script src="commerce.js" defer></script>

</body>
</html>
