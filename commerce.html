<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Commerce Quête</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="commerce.css">
</head>
<body>

  <!-- Fond -->
  <div id="background"></div>

  <!-- Pirates -->
  <img id="pirate2bis" class="pirate locked" src="images/Pirate2.png" alt="">
  <img id="pirate5bis" class="pirate locked" src="images/Pirate5.png" alt="">

  <!-- Vidéo -->
  <div id="videoContainer">
    <video id="questVideo" preload="auto">
      <source src="video/Commercevideo.MOV" type="video/mp4">
      Votre navigateur ne supporte pas la vidéo.
    </video>
    <div id="videoControls">
      <button id="toggleSound">🔊</button>
      <button id="closeVideo">✖</button>
    </div>
  </div>

  <!-- Boutons après vidéo -->
  <div id="buttonsContainer">
    <button id="replayVideo">Revoir la vidéo</button>
    <button id="finishQuest">Terminer la quête</button>
  </div>

  <script src="commerce.js"></script>
</body>
</html>
