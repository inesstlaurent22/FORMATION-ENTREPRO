<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Quête Commerce</title>
  <link rel="stylesheet" href="commerce.css" />
</head>

<body>

<!-- ========================= -->
<!-- 📽️ VIDÉO INTRO -->
<!-- ========================= -->
<div id="videoContainer">
  <video
    id="questVideo"
    src="videos/Commercevideo.MOV"
    preload="auto"
    playsinline
    webkit-playsinline
  ></video>

  <!-- contrôles -->
  <div id="videoControls">
    <button id="toggleSound">🔊</button>
    <button id="closeVideo">✖</button>
  </div>
</div>

<!-- ========================= -->
<!-- 🏝️ FOND + PIRATES -->
<!-- ========================= -->
<div id="background">
  <img src="images/Commercefond.PNG" class="fondImage" />

  <!-- positions demandées -->
  <img
    id="pirate2bis"
    class="pirate"
    src="images/Pirate2.png"
    style="left:516px; top:406px;"
  />

  <img
    id="pirate5bis"
    class="pirate"
    src="images/Pirate5.png"
    style="left:785px; top:397px;"
  />
</div>

<!-- ========================= -->
<!-- 💬 BULLES DE DIALOGUE -->
<!-- ========================= -->
<div id="bubbleContainer"></div>

<!-- ========================= -->
<!-- 🌫️ OVERLAY FLOU -->
<!-- ========================= -->
<div id="overlayBlur"></div>

<!-- ========================= -->
<!-- ⏳ LOADER MINI-JEU -->
<!-- ========================= -->
<div id="loaderContainer">
  <div id="loaderText">Gagne ce mini jeux pour continuer ta quête</div>
</div>

<!-- ========================= -->
<!-- 🎯 MINI-JEU QUIZ -->
<!-- ========================= -->
<div id="miniGameContainer">
  <div id="gameQuestion"></div>
  <div id="gameAnswers"></div>
  <p id="gameFeedback"></p>
</div>

<!-- ========================= -->
<!-- 🏆 ÉCRAN DE VICTOIRE -->
<!-- ========================= -->
<div id="victoryScreen">
  <div class="victoryBox">
    <h2>Tu as gagné 5000 PO 💰</h2>
    <canvas id="fireworksCanvas"></canvas>
  </div>
</div>

<script src="commerce.js"></script>
</body>
</html>
