<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUÊTE 1 : COMMERCE</title>
  <link rel="stylesheet" href="commerce.css">
</head>

<body>

<div class="Fondcom">

  <!-- FOND -->
  <img src="images/Commercefond.PNG" class="fondcom" alt="Fond">

  <!-- OVERLAY CINÉMATIQUE (fade-out vers menu) -->
  <div id="cinematicFadecom"></div>

  <!-- VIDÉO -->
  <div id="videoContainercom">
    <button id="closeVideocom">✕</button>

    <!-- 🔊 UN SEUL BOUTON SON (GAUCHE) -->
    <button id="soundButtoncom">🔇</button>

    <video
      id="comVideo"
      playsinline
      muted
      preload="auto"
      controls
    >
      <source src="video/Commercevideo.MOV" type="video/mp4">
    </video>
  </div>

  <!-- BOUTON VALIDATION QUÊTE -->
  <button id="validateBtn">TERMINER LA QUÊTE</button>

</div>

<script src="commerce.js"></script>
</body>
</html>
