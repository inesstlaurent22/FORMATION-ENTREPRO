<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Quête Commerce</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="commerce.css">
</head>

<body>

  <!-- 🎬 VIDÉO (TOUJOURS EN PREMIER) -->
  <div id="videoContainer">
    <video
      id="questVideo"
      autoplay
      muted
      playsinline
      preload="auto"
    >
      <source src="videos/Commercevideo.MOV" type="video/mp4">
    </video>

    <div id="videoControls">
      <button id="toggleSound">🔇</button>
      <button id="closeVideo">✖</button>
    </div>
  </div>

  <!-- 🌅 BACKGROUND + PIRATES -->
  <div id="background">
    <img src="images/Commercefond.PNG" class="fondImage" alt="Fond commerce">

    <img
      id="pirate2bis"
      class="pirate"
      src="images/Pirate2.png"
      alt="Pirate apprenti"
    >

    <img
      id="pirate5bis"
      class="pirate"
      src="images/Pirate5.png"
      alt="Maître pirate"
    >
  </div>

  <!-- 💬 BULLES DE DIALOGUE -->
  <div id="bubbleContainer"></div>

  <!-- ⏭️ IGNORER DIALOGUES -->
  <button id="skipDialoguesBtn">
    Ignorer les dialogues
  </button>

  <!-- 🌑 FADE + LOADER -->
  <div id="fadeScreen">
    <div class="loaderBox">
      Termines ce mini-jeu et tu pourras continuer la quête
    </div>
  </div>

  <!-- 🎮 MINI-JEU -->
  <div id="miniGameContainer">
    <div id="gameQuestion"></div>
    <div id="gameAnswers"></div>
    <div id="gameFeedback"></div>
  </div>

  <!-- 🏆 RÉCOMPENSE -->
  <div id="rewardScreen">
    <div class="rays"></div>

    <div class="rewardBox">
      <strong>Bravo !</strong><br><br>
      Tu as gagné <strong>5000 PO 💰</strong><br>
      et ton <strong>Business Plan 📔</strong>
    </div>
  </div>

  <!-- 📖 LIVRE -->
  <div class="book-container">

  <div class="book">

    <!-- PAGE GAUCHE : verso fixe -->
    <div class="page left">
      <img src="images/Businessplan4.jpg" alt="Verso">
    </div>

    <!-- PAGE DROITE : change -->
    <div class="page right">
      <img id="rightPage" src="images/Businessplancov.png" alt="Page droite">
    </div>

    <!-- BOUTONS PIRATE -->
    <button class="bookNav left" id="prevPage">◀</button>
    <button class="bookNav right" id="nextPage">▶</button>

  </div>

</div>

  <!-- ▶️ CONTINUER LA QUÊTE -->
  <button id="continueQuestBtn">
    Continuer la quête
  </button>

  <!-- 📜 SCRIPT -->
  <script src="commerce.js"></script>

</body>
</html>
