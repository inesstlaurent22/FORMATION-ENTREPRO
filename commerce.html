<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Quête Commerce</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="commerce.css">
</head>

<body>

<!-- =====================================================
     🎬 VIDÉO D’INTRO
===================================================== -->
<div id="videoContainer">
  <video id="questVideo" autoplay muted playsinline preload="auto">
    <source src="videos/Commercevideo.MOV" type="video/mp4">
    Votre navigateur ne supporte pas la vidéo.
  </video>

  <div id="videoControls">
    <button id="toggleSound">🔇</button>
    <button id="closeVideo">Passer la vidéo</button>
  </div>
</div>

<!-- =====================================================
     🌅 BACKGROUND + PIRATES
===================================================== -->
<div id="background">
  <img src="images/Commercefond.PNG" class="fondImage" alt="Fond du marché pirate">

  <!-- Pirate apprenti -->
  <img
    id="pirate2bis"
    class="pirate hidden"
    src="images/Pirate2.png"
    alt="Pirate apprenti"
  >

  <!-- Pirate maître -->
  <img
    id="pirate5bis"
    class="pirate hidden"
    src="images/Pirate5.png"
    alt="Maître pirate"
  >

  <!-- Pirate client (apparaît plus tard) -->
  <img
    id="pirate3bis"
    class="pirate hidden"
    src="images/Pirateclients.png"
    alt="Pirate client"
  >
</div>

<!-- =====================================================
     💬 BULLES DE DIALOGUE
===================================================== -->
<div id="bubbleContainer"></div>

<!-- =====================================================
     🎮 MINI-JEU 1 — QUIZ
===================================================== -->
<div id="miniGameContainer" class="hidden">
  <div class="quizBox">
    <div id="gameQuestion"></div>
    <div id="gameAnswers"></div>
    <div id="gameFeedback"></div>
  </div>
</div>

<!-- =====================================================
     🏆 MESSAGE DE RÉUSSITE / COMPTEUR PO
===================================================== -->
<div id="fadeScreen" class="hidden">
  <div class="loaderBox">
    <div class="rewardTitle">🎉 Bravo !</div>
    <div class="rewardCounter" id="poCounter">0 PO</div>
    <div class="rewardSub">Business Plan débloqué</div>
  </div>
</div>

<!-- =====================================================
     📖 LIVRE DIGITAL
===================================================== -->
<div id="bookContainer" class="hidden">
  <div class="book">
    <div class="page left">
      <img id="leftPage" src="" alt="Page gauche">
    </div>
    <div class="page right">
      <img id="rightPage" src="" alt="Page droite">
    </div>
  </div>

  <button id="continueQuestBtn" class="hidden">
    Continuer la quête
  </button>
</div>

<!-- =====================================================
     🎮 MINI-JEU 2 — LE JUGEMENT DU MARCHAND
===================================================== -->
<div id="merchantGame" class="hidden">
  <div id="game">

    <h1>🧔‍♂️ Le Jugement du Marchand</h1>

    <div id="dialogue">
      <p id="clientText">
        « J’ai vu cet objet à moitié prix dans un autre port… »
      </p>
    </div>

    <div id="clue"></div>

    <div id="buttons">
      <button onclick="analyzeClient()">🧠 Analyser</button>
      <button onclick="lowerPrice()">💰 Baisser le prix</button>
      <button onclick="keepPrice()">⚖️ Maintenir le prix</button>
      <button onclick="refuseSale()">❌ Refuser</button>
    </div>

    <div id="stats">
      <p>💰 Or du marchand : <span id="gold">1200</span> PO</p>
      <p>📦 Prix de l’objet : <span id="price">300</span> PO</p>
      <p>⭐ Expérience : <span id="exp">65</span></p>
    </div>

  </div>
</div>

<!-- =====================================================
     📜 SCRIPT
===================================================== -->
<script src="commerce.js"></script>

</body>
</html>
