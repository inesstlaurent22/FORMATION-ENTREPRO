<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Le bureau de change 💰</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/png" href="images/Favicons1.PNG?v=2">
  <link rel="stylesheet" href="finance.css">
</head>

<body>

<!-- 🎬 VIDÉO -->
<div id="videoContainer">
  <video id="questVideo" autoplay muted playsinline preload="auto">
    <source src="videos/Financevideo.MOV" type="video/mp4">
  </video>

  <div id="videoControls">
    <button id="toggleSound" type="button">🔇</button>
    <button id="closeVideo" type="button">Passer la vidéo</button>
  </div>
</div>

<!-- 🌑 LOADER -->
<div id="fadeScreen" class="hidden">
  <div class="loaderBox">
    <div class="loaderEmoji">🏴‍☠️</div>
  </div>
</div>

<!-- 🌊 SCÈNE -->
<div id="scene" class="hidden">

  <img src="images/Fondfinance.PNG" class="fondImage" alt="Marché pirate">

  <div id="pirate5bis" class="pirate hidden"
       style="background-image:url('images/Piratefinance.png');"></div>

  <div id="pirate2bis" class="pirate hidden"
       style="background-image:url('images/Pirate2.png');"></div>

</div>

<!-- 🎮 CONTAINER UNIQUE DES MINI-JEUX -->
<div id="miniGameContainer" class="hidden"></div>

<script src="finance.js"></script>
</body>
</html>
