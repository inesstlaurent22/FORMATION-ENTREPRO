<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Quête Finance – KIT IN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="finance.css">
</head>

<body>

<!-- 🎬 VIDÉO -->
<div id="videoContainer">
  <video id="questVideo" autoplay muted playsinline preload="auto">
    <source src="videos/Financevideo.MOV" type="video/mp4">
  </video>

  <div id="videoControls">
    <button id="toggleSound">🔇</button>
    <button id="closeVideo">Passer la vidéo</button>
  </div>
</div>

<!-- 🌅 SCÈNE -->
<div id="background" class="hidden">

  <img src="images/Fondfinance.PNG" class="fondImage" alt="Marché pirate">

  <!-- Pirates -->
  <img id="pirate5bis" class="pirate hidden" src="images/Piratefinance.png" alt="Pirate maître">
  <img id="pirate2bis" class="pirate hidden" src="images/Pirate2.png" alt="Pirate apprenti">

  <!-- 🎮 MINI-JEU 1 -->
  <div id="miniGame0" class="hidden"></div>

  <!-- 🎮 MINI-JEU 2 -->
  <div id="financeGame" class="hidden">

    <div id="part1" class="hidden">
      <h3>🧾 Analyse des clients</h3>
      <p>Analyse les registres et choisis le pirate le plus rentable.</p>

      <div class="clients">
        <div>
          <button onclick="showBill('A')">🧾 Barbe-Cuivre</button>
          <button onclick="chooseClient(this)">Je choisis ce pirate</button>
        </div>
        <div>
          <button onclick="showBill('B')">🧾 Vent-Noir</button>
          <button onclick="chooseClient(this)">Je choisis ce pirate</button>
        </div>
        <div>
          <button onclick="showBill('C')">🧾 Crâne-Rouge</button>
          <button onclick="chooseClient(this)">Je choisis ce pirate</button>
        </div>
      </div>

      <div id="bill"></div>
    </div>

    <div id="part2" class="hidden">
      <h3>💰 Résultat annuel</h3>
      <p>Chiffre d’affaires : <strong>12 000</strong></p>
      <p>Charges : <strong>8 500</strong></p>

      <button onclick="checkResult(false)">Charges + Produits</button>
      <button onclick="checkResult(true)">Produits − Charges</button>
      <button onclick="checkResult(false)">Charges × Produits</button>
    </div>

    <div id="part3" class="hidden">
      <h3>🛠️ Amortissements</h3>

      <p>Prix d’achat : 500</p>
      <p>Provision : 150</p>
      <p>Durée : 3 ans</p>

      <button onclick="checkAmortBase(false)">500</button>
      <button onclick="checkAmortBase(true)">350</button>
      <button onclick="checkAmortBase(false)">150</button>

      <div id="amortMonth" class="hidden">
        <p>Amortissement mensuel ?</p>
        <button onclick="checkMonthlyAmort(false)">97 €</button>
        <button onclick="checkMonthlyAmort(true)">117 €</button>
        <button onclick="checkMonthlyAmort(false)">150 €</button>
      </div>
    </div>

  </div>
</div>

<script src="finance.js"></script>
</body>
</html>
