<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Quête Commerce</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="finance.css">
</head>

<body>

<!-- =====================================================
     🎬 VIDÉO D’INTRO
===================================================== -->
<div id="videoContainer">
  <video id="questVideo" autoplay muted playsinline preload="auto">
    <source src="videos/Financevideo.MOV" type="video/mp4">
    Votre navigateur ne supporte pas la vidéo.
  </video>

  <div id="videoControls">
    <button id="toggleSound">🔇</button>
    <button id="closeVideo">Passer la vidéo</button>
  </div>
</div>

<!-- =====================================================
     🌅 BACKGROUND + PIRATES
===================================================== -->
<div id="background" class="hidden">
  <img
    src="images/Fondfinance.PNG"
    class="fondImage"
    alt="Fond du marché pirate"
  >

  <!-- Pirate apprenti -->
  <img
    id="pirate2bis"
    class="pirate hidden"
    src="images/Pirate2.png"
    alt="Pirate apprenti"
  >

  <!-- Pirate maître -->
  <img
    id="pirate5bis"
    class="pirate hidden"
    src="images/Piratefinance.png"
    alt="Pirate maître"
  >

<script src="finance.js"></script>

</body>
</html>
