<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>💰Le bureau de change </title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/png" href="images/Favicons1.PNG?v=2">
  <link rel="stylesheet" href="finance.css">
</head>

<body>

<!-- =====================================================
     🎬 VIDÉO D’INTRO
===================================================== -->
<div id="videoContainer">

  <video
    id="questVideo"
    autoplay
    muted
    playsinline
    preload="auto"
  >
    <source src="videos/Financevideo.MOV" type="video/mp4">
  </video>

  <div id="videoControls">
    <button id="toggleSound" type="button">🔇</button>
    <button id="closeVideo" type="button">Passer la vidéo</button>
  </div>

</div>

<!-- =====================================================
     🌅 SCÈNE PRINCIPALE
===================================================== -->
<div id="background" class="hidden">

  <!-- 🌄 FOND -->
  <img
    src="images/Fondfinance.PNG"
    class="fondImage"
    alt="Marché pirate"
  >

  <!-- 🏴‍☠️ PIRATES -->
  <img
    id="pirate5bis"
    class="pirate hidden"
    src="images/Piratefinance.png"
    alt="Pirate maître"
  >

  <img
    id="pirate2bis"
    class="pirate hidden"
    src="images/Pirate2.png"
    alt="Pirate apprenti"
  >

  <!-- =====================================================
       🎮 MINI-JEU 1 — QCM REGISTRES
  ===================================================== -->
  <div id="miniGame0" class="hidden"></div>

<!-- =====================================================
     🎮 MINI-JEU 2 — ANALYSE FINANCIÈRE
===================================================== -->
<div id="financeGame" class="hidden">

  <!-- ===== PARTIE 1 : ANALYSE DES CLIENTS ===== -->
  <div id="part1" class="hidden">

    <h3>🧾 Analyse des clients</h3>

    <div class="questionBox">
      <p>
        Consulte chaque facture avant de choisir le client le plus rentable.
      </p>
    </div>

    <div class="clients">

      <div class="clientBlock">
        <button type="button" onclick="showBill('A')">
          🧾 Barbe-Cuivre
        </button>

        <button 
          type="button"
          onclick="chooseClient(this)"
          disabled>
          Je choisis ce pirate
        </button>
      </div>

      <div class="clientBlock">
        <button type="button" onclick="showBill('B')">
          🧾 Vent-Noir
        </button>

        <button 
          type="button"
          onclick="chooseClient(this)"
          disabled>
          Je choisis ce pirate
        </button>
      </div>

      <div class="clientBlock">
        <button type="button" onclick="showBill('C')">
          🧾 Crâne-Rouge
        </button>

        <button 
          type="button"
          onclick="chooseClient(this)"
          disabled>
          Je choisis ce pirate
        </button>
      </div>

    </div>

    <div id="bill"></div>

  </div>

  <!-- ===== PARTIE 2 : RÉSULTAT ===== -->
  <div id="part2" class="hidden">

    <h3>💰 Résultat annuel</h3>

    <div class="questionBox">
      <p>Chiffre d’affaires : <strong>12 000 PO</strong></p>
      <p>Charges : <strong>8 500 PO</strong></p>
    </div>

    <button type="button" onclick="checkResult(false)">
      Charges + Produits
    </button>

    <button type="button" onclick="checkResult(true)">
      Produits − Charges
    </button>

    <button type="button" onclick="checkResult(false)">
      Charges × Produits
    </button>

  </div>

  <!-- ===== PARTIE 3 : AMORTISSEMENTS ===== -->
<!-- ===== PARTIE 3 : AMORTISSEMENT ===== -->
<div id="part3" class="hidden">

  <h3>🛠️ Amortissement</h3>

  <div class="questionBox">
    <p>Prix d’achat : <strong>500 PO</strong></p>
    <p>Provision : <strong>150 PO</strong></p>
    <p>Durée : <strong>3 ans</strong></p>
  </div>

  <button type="button" onclick="checkAmortBase(false)">500</button>
  <button type="button" onclick="checkAmortBase(true)">350</button>
  <button type="button" onclick="checkAmortBase(false)">150</button>

</div>

<!-- ===== PARTIE 4 : AMORTISSEMENT ANNUEL ===== -->
<div id="part4" class="hidden">

  <h3>📆 Amortissement annuel</h3>

  <div class="questionBox">
    <p>Quel est l’amortissement annuel ?</p>
  </div>

  <button type="button" onclick="checkMonthlyAmort(false)">97 PO</button>
  <button type="button" onclick="checkMonthlyAmort(true)">117 PO</button>
  <button type="button" onclick="checkMonthlyAmort(false)">150 PO</button>

</div>

</div>
  
  <!-- =====================================================
       🎮 MINI-JEU 3 — CONTENU INJECTÉ PAR finance.js
  ===================================================== -->
  <div id="miniGame3" class="hidden"></div>

</div>

<!-- =====================================================
     📜 SCRIPT
===================================================== -->
<script src="finance.js"></script>

</body>
</html>
