<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Communication – La Criée Pirate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS PRINCIPAL -->
  <link rel="stylesheet" href="communication.css">
</head>

<body>

  <!-- ========================= -->
  <!-- 🎬 VIDÉO D’INTRO -->
  <!-- ========================= -->
  <div id="videoIntro" class="fullscreen">
    <video
      id="introVideo"
      src="videos/Video1.MOV"
      autoplay
      playsinline
    ></video>

    <div class="video-controls">
      <button id="toggleSound">🔊</button>
      <button id="closeVideo">✖</button>
    </div>
  </div>

  <!-- ========================= -->
  <!-- 🌊 SCÈNE BACKGROUND -->
  <!-- ========================= -->
  <div id="scene" class="hidden">

    <!-- Pirate 2 (PNJ) -->
    <div id="pirate2" class="pirate npc"></div>

    <!-- Pirate 5 (Interactif) -->
    <div id="pirate5" class="pirate clickable"></div>

  </div>

  <!-- ========================= -->
  <!-- ⏳ LOADER -->
  <!-- ========================= -->
  <div id="loader" class="hidden">
    <span id="loaderText">Chargement…</span>
  </div>

  <!-- ========================= -->
  <!-- 💬 DIALOGUES -->
  <!-- ========================= -->
  <div id="dialogBox" class="hidden">
    <p id="dialogText"></p>
    <button id="nextDialog">Continuer</button>
  </div>

  <!-- ========================= -->
  <!-- 🎮 MINI-JEUX -->
  <!-- ========================= -->
  <div id="miniGameContainer" class="hidden"></div>

  <!-- ========================= -->
  <!-- 📜 SCRIPT -->
  <!-- ========================= -->
  <script src="communication.js"></script>

</body>
</html>
