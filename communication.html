<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Communication</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="communication.css">
</head>

<body>

  <div class="communication-page">
    <div class="overlay"></div>
  </div>

  <div id="miniGameSocial">

  <h2 class="title">📣 La Criée du Pirate</h2>
  <p class="subtitle">
    Ton trésor est prêt… mais personne n’est au courant !
  </p>

  <!-- Jauge de renommée -->
  <div class="renommee-box">
    <span>Renommée</span>
    <div class="bar">
      <div id="renommeeFill"></div>
    </div>
    <span id="renommeeValue">0%</span>
  </div>

  <!-- Réseaux pirates -->
  <div class="networks">
    <button class="network insta" onclick="useNetwork('insta')">
      📜 Parchemin-Gram
    </button>
    <button class="network tiktok" onclick="useNetwork('tiktok')">
      📣 Corne-Tok
    </button>
    <button class="network twitter" onclick="useNetwork('twitter')">
      🦜 Perroquet-X
    </button>
  </div>

  <!-- Port pirate -->
  <div id="harbor">
    <p class="harbor-title">⚓ Le Port Pirate</p>
  </div>

  <!-- Message -->
  <div id="message"></div>

</div>

</body>
</html>
