<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Communication – Criée Pirate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS du mini-jeu -->
  <link rel="stylesheet" href="criee-pirate.css">

  <!-- CSS spécifique à la page -->
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: url("Communicationfond.PNG") no-repeat center center / cover;
      overflow:hidden;
    }
  </style>
</head>
<body>

  <!-- 🏴‍☠️ CADRE PIRATE -->
  <div id="pirateFrame">

    <!-- 🎮 MINI-JEU -->
    <div id="miniGameSocial">

      <h2 class="title">📣 La Criée du Pirate</h2>
      <p class="subtitle">
        Ton trésor est prêt… mais personne n’est au courant !
      </p>

      <!-- Jauge de renommée -->
      <div class="renommee-box">
        <span>Renommée</span>
        <div class="bar">
          <div id="renommeeFill"></div>
        </div>
        <span id="renommeeValue">0%</span>
      </div>

      <!-- Réseaux pirates -->
      <div class="networks">
        <button class="network insta" data-network="insta">
          📜 Parchemin-Gram
        </button>
        <button class="network tiktok" data-network="tiktok">
          📣 Corne-Tok
        </button>
        <button class="network twitter" data-network="twitter">
          🦜 Perroquet-X
        </button>
      </div>

      <!-- Port pirate -->
      <div id="harbor">
        <p class="harbor-title">⚓ Le Port Pirate</p>
      </div>

      <!-- Message -->
      <div id="message"></div>

    </div>
  </div>

  <!-- JS : lancement après chargement du background -->
  <script src="criee-pirate.js"></script>

</body>
</html>
