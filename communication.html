<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Communication – La Criée Pirate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS principal -->
  <link rel="stylesheet" href="communication.css">
</head>

<body>

<!-- =====================================================
     🎬 VIDÉO INTRO
===================================================== -->
<div id="videoContainer">

  <video
    id="questVideo"
    src="videos/Communicationvideo2.MOV"
    autoplay
    muted
    playsinline
    preload="auto"
  ></video>

  <div id="videoControls">
    <button id="toggleSound" type="button">🔇</button>
    <button id="closeVideo" type="button">Passer la vidéo</button>
  </div>

</div>

<!-- =====================================================
     🌊 SCÈNE PRINCIPALE
===================================================== -->
<div id="scene" class="hidden">

  <img
    src="images/Communicationfond.PNG"
    class="fondImage"
    alt=""
    loading="eager"
  >

  <button id="skipDialog" class="skip-dialog hidden">
    Passer les dialogues
  </button>

  <div id="pirate3" class="pirate"></div>
  <div id="pirate2" class="pirate"></div>

</div>

<!-- =====================================================
     💬 BULLE DE DIALOGUE
===================================================== -->
<div id="dialogBox" class="hidden">
  <p id="dialogText"></p>
</div>

<!-- =====================================================
     🎮 CONTENEUR MINI-JEUX
===================================================== -->
<div id="miniGameContainer" class="hidden"></div>

<!-- =====================================================
     📜 SCRIPT
===================================================== -->
<script src="communication.js"></script>

</body>
</html>
