<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Communication – La Criée Pirate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="communication.css">
</head>

<body>

<!-- 🎬 VIDÉO INTRO -->
<div id="videoIntro" class="fullscreen">
  <video
    id="introVideo"
    src="videos/Video1.MOV"
    playsinline
    muted
  ></video>

  <div class="video-controls">
    <button id="toggleSound" class="btn-pirate">🔊</button>
    <button id="closeVideo" class="btn-pirate">✖</button>
  </div>
</div>

<!-- ⏳ LOADER -->
<div id="loader" class="hidden">
  <span id="loaderText">Chargement…</span>
</div>

<!-- 🌊 SCÈNE -->
<div id="scene" class="hidden">

  <div id="pirate2" class="pirate"></div>
  <div id="pirate3" class="pirate clickable"></div>

  <!-- 💬 BULLE DE DIALOGUE (clic simple) -->
  <div id="dialogBox" class="hidden">
    <p id="dialogText"></p>
  </div>

</div>

<!-- 🎮 MINI-JEU -->
<div id="miniGameContainer" class="hidden"></div>

<script src="communication.js"></script>
</body>
</html>
