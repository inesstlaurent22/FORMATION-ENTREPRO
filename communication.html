<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title> 💎 La boutique des pirates </title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/Favicons1.PNG?v=2">
  <link rel="stylesheet" href="communication.css">
</head>

<body>

<!-- =====================================================
     🎬 VIDÉO INTRO
===================================================== -->
<div id="videoContainer">
  <video
    id="questVideo"
    preload="auto"
    playsinline
    muted
  >
    <source src="videos/Communicationvideo2.MOV" type="video/mp4">
  </video>

  <div id="videoControls">
    <button id="toggleSound" type="button">🔇</button>
    <button id="closeVideo" type="button">Passer la vidéo</button>
  </div>
</div>

<!-- =====================================================
     CHATBOX
===================================================== -->
  
<div id="chatbot-container">

  <!-- Bouton -->
  <button 
    id="chatbot-toggle" 
    type="button"
    aria-label="Ouvrir le chatbot"
    aria-expanded="false">
    💬
  </button>

  <!-- Fenêtre -->
  <div 
    id="chatbot-box"
    role="dialog"
    aria-modal="true"
    aria-labelledby="chatbot-header">

    <!-- Header -->
    <div id="chatbot-header">Assistant IA</div>

    <!-- Messages -->
    <div id="chatbot-messages"></div>

    <!-- Input -->
    <div id="chatbot-input-area">
      <input 
        type="text" 
        id="chatbot-input" 
        placeholder="Pose ta question..."
        autocomplete="off"
      />

      <button 
        id="chatbot-send" 
        type="button"
        aria-label="Envoyer le message">
        ➤
      </button>
    </div>

  </div>

</div>
  
<!-- =====================================================
     🌊 SCÈNE PRINCIPALE
===================================================== -->
<div id="scene" class="hidden">

  <!-- Background -->
  <img src="images/Communicationfond.PNG" class="fondImage" alt="">

  <!-- Skip dialogues -->
<button
  id="skipDialoguesBtn"
  class="hidden"
  type="button"
>
  Passer les dialogues
</button>

  <!-- Pirates -->
  <div id="pirate3" class="pirate"></div>
  <div id="pirate2" class="pirate"></div>

</div>

<!-- =====================================================
     💬 DIALOGUES
===================================================== -->
<div id="dialogBox" class="hidden">
  <p id="dialogText"></p>
</div>

<!-- =====================================================
     🎮 MINI-JEUX
===================================================== -->
<div id="miniGameContainer" class="hidden"></div>

<!-- =====================================================
     🌑 LOADER GLOBAL (VIDÉO / MINI-JEUX / TRANSITIONS)
===================================================== -->
<div id="fadeScreen" class="hidden">
  <div class="loaderBox">
    <div class="loaderEmoji">🏴‍☠️</div>
  </div>
</div>

<!-- JS -->
<script src="communication.js"></script>
<script src="agentia.js" defer></script>

</body>
</html>
