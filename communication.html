<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Communication – La Criée Pirate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS GLOBAL -->
  <link rel="stylesheet" href="communication.css">

  <!-- Background spécifique -->
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: url("images/Communicationfond.PNG") no-repeat center center / cover;
      overflow:hidden;
      font-family: serif;
    }
  </style>
</head>

<body>

  <!-- ========================= -->
  <!-- 🎬 VIDÉO D’INTRODUCTION -->
  <!-- ========================= -->
  <div id="videoIntro" class="fullscreen">
    <video id="introVideo" src="videos/Video1.MOV" autoplay></video>

    <div class="video-controls">
      <button id="toggleSound">🔊</button>
      <button id="closeVideo">✖</button>
    </div>
  </div>

  <!-- ========================= -->
  <!-- 🌊 SCÈNE PRINCIPALE -->
  <!-- ========================= -->
  <div id="scene" class="hidden">

    <!-- Pirates décor -->
    <div id="pirate2" class="pirate npc">🏴‍☠️</div>
    <div id="pirate3" class="pirate clickable">🏴‍☠️</div>

  </div>

  <!-- ========================= -->
  <!-- ⏳ LOADER -->
  <!-- ========================= -->
  <div id="loader" class="hidden">
    <span id="loaderText">Chargement…</span>
  </div>

  <!-- ========================= -->
  <!-- 💬 DIALOGUES -->
  <!-- ========================= -->
  <div id="dialogBox" class="hidden">
    <p id="dialogText"></p>
    <button id="nextDialog">Continuer</button>
  </div>

  <!-- ========================= -->
  <!-- 🎮 CONTENEUR MINI-JEUX -->
  <!-- ========================= -->
  <div id="miniGameContainer" class="hidden"></div>

  <!-- ========================= -->
  <!-- 📜 SCRIPT -->
  <!-- ========================= -->
  <script src="communication.js"></script>

</body>
</html>
